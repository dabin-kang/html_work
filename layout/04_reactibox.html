<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>react</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .wrapper{
            width: 20vw;
            height:80vh;
            background-color: blue;
            position: relative;
           
        header{
            color: aliceblue;
        }

        section{
            width: 16vw;
            height: 65vh;
            background-color: antiquewhite;
            position: absolute;
        }
        section>div{
            width: 6vw;
            height: 10vh;
            border: 2px solid#000;
            margin: 10px;
            display: flex; 
        }
            
    </style>
</head>
<body>
    <h1>06_react_layout</h1>
    <div class="wrapper">
        <header>
            <h1>로고</h1>
        </header>
        <section>
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div> 
        </section>

    </div>
    
</body>
</html>
