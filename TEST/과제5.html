<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학생 성적표</title>
  <style>
    .row {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      border-bottom: 1px solid #aaa;
      text-align: center;
      padding: 5px;
    }
    .header {
      font-weight: bold;
      background: #eee;
    }
  </style>
</head>
<body>
  <script>
    // [이름, 성별, 반, 국어, 영어, 수학]
    let studs = [
      ['임수빈', '여', 3, 48, 71, 83],
      ['강지민', '여', 2, 73, 52, 81], 
      ['신민수', '남', 3, 60, 44, 76],  
      ['윤현우', '남', 2, 65, 45, 55],  
      ['정지원', '여', 2, 68, 74, 61],  
      ['정유진', '남', 2, 41, 97, 100],
      ['조지민', '남', 1, 100, 61, 63],  
      ['최지현', '남', 1, 44, 92, 47],  
      ['조지현', '여', 2, 66, 40, 63],  
      ['최지후', '남', 1, 48, 100, 49],  
      ['조현서', '여', 3, 60, 62, 40],  
      ['신도윤', '남', 1, 81, 63, 45],  
      ['윤예은', '여', 3, 80, 58, 54],  
      ['한수빈', '여', 3, 42, 91, 48],  
      ['서유진', '여', 1, 92, 59, 41],  
      ['이하린', '남', 1, 80, 75, 52],  
      ['장지민', '남', 2, 80, 88, 69],  
      ['장세영', '여', 3, 64, 54, 46],  
      ['조하은', '여', 3, 55, 61, 88],  
      ['강현서', '남', 3, 72, 48, 85],  
      ['서나연', '남', 2, 86, 85, 66],  
      ['장예은', '남', 2, 54, 51, 57],  
      ['박지원', '남', 2, 64, 81, 52],  
      ['최예은', '남', 1, 74, 53, 44],  
      ['박준호', '여', 3, 46, 87, 45],  
      ['서지현', '남', 2, 78, 87, 43],  
      ['임도윤', '남', 1, 55, 58, 98],  
      ['강지민', '남', 1, 45, 52, 87],  
      ['윤수빈', '여', 2, 48, 81, 58],  
      ['정세영', '여', 1, 86, 66, 87],  
      ['이하은', '여', 3, 75, 94, 64],  
      ['서민수', '여', 1, 65, 99, 49],  
      ['임수빈', '여', 3, 58, 66, 74],  
      ['김나연', '남', 1, 81, 95, 90],  
      ['정예은', '남', 3, 55, 100, 53],  
      ['정은우', '남', 3, 42, 65, 83],  
      ['김지민', '여', 2, 92, 70, 59],  
      ['신도윤', '남', 2, 64, 94, 82],  
      ['임하은', '여', 2, 74, 57, 57],  
      ['이지원', '남', 2, 68, 76, 95],  
      ['신도윤', '남', 1, 85, 55, 72],  
      ['신은우', '여', 2, 73, 89, 63],  
      ['임현서', '남', 2, 70, 95, 62],  
      ['한지민', '남', 3, 87, 48, 95],  
      ['정시우', '여', 3, 69, 90, 70]  
    ];

    // 2. 계산부 (총점, 평균)
    for (let i in studs){
      let tot = 0;
      let jumsu = studs[i].slice(3); // 국영수만
      for(const j of jumsu){
        tot += j;
      }
      studs[i].push(tot); // [6] 총점
      studs[i].push(Math.round((tot/jumsu.length)*100)/100); // [7] 평균
    }

    // 3. 등수
    for (let me in studs){
      let rank = 1;
      for (let you in studs){
        if(studs[me][6] < studs[you][6]){
          rank++;
        }
      }
      studs[me].push(rank); // [8] 등수
    }

    // 4. 출력부 (등수순)
    document.write("<h2>학생 성적표</h2>");
    // 헤더
    document.write("<div class='row header'>");
    let headers = ["이름","성별","반","국어","영어","수학","총점","평균","등수"];
    for (let h of headers){
      document.write(`<div>${h}</div>`);
    }
    document.write("</div>");

    // 데이터
    for (let rr=1; rr<=studs.length; rr++){
      for(const st of studs){
        if(rr === st[8]){
          document.write("<div class='row'>");
          for(const v of st){
            document.write(`<div>${v}</div>`);
          }
          document.write("</div>");
        }
      }
    }
  </script>
</body>
</html>
