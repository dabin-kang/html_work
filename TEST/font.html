<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>font</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Black+Han+Sans&family=East+Sea+Dokdo&family=Gowun+Dodum&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .bg {
            width: 800px;
            height: 300px;

        }

        .top {
            width: 800px;
            height: 170px;

            text-align: center;
            font-size: 43px;
            justify-content: center;
           

            font-family: "Bitcount Grid Double", system-ui;
            font-optical-sizing: auto;
            font-weight: 400px;
            font-style: normal;
            font-variation-settings:
                "slnt" 0,
                "CRSV" 0.5,
                "ELSH" 0,
                "ELXP" 0;
        }

        .box {
            display: flex;
            justify-content: space-around;
            text-align: center;

        }

        .box>div {
            width: 100px;
            height: 100px;
            background-color: burlywood solid #000;
        }

        .box>div:nth-of-type(1) {
            background-image: url(../fff/font/menu01.png);
            background-size: 100px 100px;
        }

        .box>div:nth-of-type(2) {
            background-image: url(../fff/font/menu02.png);
            background-size: 100px 100px;
        }

        .box>div:nth-of-type(3) {
            background-image: url(../fff/font/menu03.png);
            background-size: 100px 100px;
        }

        .box>div:nth-of-type(4) {
            background-image: url(../fff/font/menu04.png);
            background-size: 100px 100px;
        }

        .box>div:nth-of-type(5) {
            background-image: url(../fff/font/menu05.png);
            background-size: 100px 100px;
        }

        .text {

            display: flex;
            justify-content: space-around;
            text-align: center;
            color: #ccc;
             font-family: "Playfair Display", serif;
            font-optical-sizing: auto;
            font-weight: 400px;
            font-style: normal;
        }
        .text>p {
            width: 100px;
        }
     
    </style>
</head>

<body>
    <h1>font</h1>
    <div class="bg">
        <div class="top">Aifredo<br>
            gonzaies
        </div>
        <div class="box">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="text">
            <p>Home</p>
            <p>shop</p>
            <p>custmcox</p>
            <p>blog</p>
            <p>story</p>
        </div>
    </div>

</body>

</html>
