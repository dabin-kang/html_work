<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>mufor</h2>
    <script>
        for (let h =1 ; h <=12 ; h++){
            document.write(`<h3>${h}시</h3>`)

            for (let m =0 ; m <60 ; m++){
                document.write(`<h3>${m}분</h3>`)
            }
        }

        let tt = 0
        for(let t = 2 ; t<=9 ; t++){
            if (t*2=== 0)
            tt = t*2
        }
        document.write(`${tt}`)


    </script>
    
</body>
