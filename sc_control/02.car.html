<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자동차 성능 점수</title>
  <style>
    .table {
      display: grid;
      grid-template-columns: repeat(6, 120px);
      border: 2px solid #000;
      text-align: center;
      margin: 20px;
    }
    .cell {
      border: 1px solid #000;
      padding: 10px;
    }
    .header {
      font-weight: bold;
      background: #eee;
    }
    .우수 { color: blue; }
    .보통 { color: green; }
    .불량 { color: red; }
  </style>
</head>
<body>
<script>
  const cr = "머스탱";
  const sp = 40, pw = 70, sf = 90;
  const score = sp * 0.4 + pw * 0.25 + sf * 0.35;

  var gradeClass = "",grade="";
      gradeClass = 
      score >= 80 ? "우수":
      score >= 60 ? "보통":
      "불량";
  
      grade = 
      score >= 80 ? "우수":
      score >= 60 ? "보통":
      "불량";
 

  document.write(`
    <div class="table">
      <div class="cell header">차종</div>
      <div class="cell header">속도</div>
      <div class="cell header">연비</div>
      <div class="cell header">안전성</div>
      <div class="cell header">결과 점수</div>
      <div class="cell header">등급</div>

      <div class="cell">${cr}</div>
      <div class="cell">${sp}</div>
      <div class="cell">${pw}</div>
      <div class="cell">${sf}</div>
      <div class="cell">${score.toFixed(1)}</div>
      <div class="cell ${gradeClass}">${grade}</div>
    </div>
  `);
</script>
</body>
</html>
