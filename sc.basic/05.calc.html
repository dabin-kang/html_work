    <h2> 2. 일항연산자</h2>
    <script>
        var c = 123
        document.write(`-${c}:${-c}<br/>`)
        c= 123
        document.write(`!${c}:${!c}<br/>`)
        c=c+1
        document.write(`c=c+1:${c}<br/>`)
        c++
        document.write(`c++ : ${c}<br/>`)
        c--
        document.write(`c-- : ${c}<br/>`)
        // c**,c//c%% 는 없다 증감연산자 ++과--만 존재한다

        c= 4
         document.write(`c++:${c}<br/>`)
         document.write(`c++:${c++}<br/>`) // 후치연산: 현재 값을 연산식에 호출하고 이후 ++ 연산
         document.write(`c:${c}<br/>`)
         document.write(`++c:${++c}<br/>`)// 전치연산 : ++연산 이후 연산식 호출
         document.write(`c:${c}<br/>`)
    </script>



    <h2> 2.1 산술연산자</h2>
    <script>

        document.write(`bit xor: $(a)^$(b) : ${a^b}<br/>`)

        /*

        5^6 : 3

    </script>

    <h2>2.shift연산자</h2>
    <script>
        a=5
        document.write(`${a}<<2 : ${a<<2}<br/>`)
        document.write(`${a}>>2 : ${a>>2}<br/>`)
        document.write(`${a}>>>2 : ${a>>>2}<br/>`)
        /* 5: 0101 << 2  :: 부호에 맞춰 오른쪽 쉬프트 샹수,0 음수 :1
                0101 00
        
        0000 0000  0  0  0000 0000 0000 0000
        0000 0001  1  1  0000 0000 0000 0001
        0000 0010  2  2  0000 0000 0000 0010
        0111 1110  126  126  0000 0000 0111 1111
        0111 1111  -128  127  0000 0000 0111 1110
        0111 1111  127  127  0000 0000 0111 1110
        0111 1111  127  127  0000 0000 0111 1110
        0111 1111  127  127  0000 0000 0111 1110
        */
        a=-5
        document.write(`${a}<<2 : ${a<<2}<br/>`)
        document.write(`${a}>>2 : ${a>>2}<br/>`)
        document.write(`${a}>>>2 : ${a>>>2}<br/>`)
    </script>


    <h2>2.5대입연산자</h2>
    <script>
        a = 5
        document.write(`a:${a}<br/>`)
        a = a + 2
        document.write(`a=a+2:${a}<br/>`)
        a +=  2
        document.write(`a+ = 2:${a}<br/>`)
        a -=  3
        document.write(`a- = 3:${a}<br/>`)
        a *=  5
        document.write(`a *= 5:${a}<br/>`)
        a /=  2
        document.write(`a /= 2:${a}<br/>`)
        a %=  3
        document.write(`a % = 3:${a}<br/>`)
        a **=  3
        document.write(`a **= 3:${a}<br/>`)
    </script>
