<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            
            width: 800px;
            height: 500px;
            border: 2px solid #000 ;
            
            align-content: center;
           
        }
    </style>
    <script>
        window.onload = function(){
            document.querySelector("img:nth-of-type(1)").onclick = function(){
                img5 = document.querySelector("img:nth-of-type(5)")
                img5.style.background = "#fa0"
            }

            document.querySelector("img:nth-of-type(2)").onmouseover = function(){
                img6 = document.querySelector("img:nth-of-type(6)")
                img6.style.boxShadow = "10px 10px 10px #000"
            }

              document.querySelector("img:nth-of-type(3)").onmouseout = function(){
                img7 = document.querySelector("img:nth-of-type(7)")
                img7.style.opacity = "0.5"
            }

            document.querySelector("img:nth-of-type(4)").onclick = function(){
                img8 = document.querySelector("img:nth-of-type(8)")
                img8.style.transform = " rotate(90deg)"
           }
        }
    </script>
</head>
<body>
    <div class="box">
    <img src="../fff/풍선01.png">
    <img src="../fff/풍선02.png">
    <img src="../fff/풍선03.png">
    <img src="../fff/풍선04.png">
    <br/>
    <img src="../fff/풍선05.png">
    <img src="../fff/풍선06.png">
    <img src="../fff/풍선07.png">
    <img src="../fff/풍선08.png">
    </div>

    
</body>
</html>
