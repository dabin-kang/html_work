<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>swich</h2>
    <script> 
        switch(20){
            case 30:
            document.write("30입니다<br/>")
            case 10://동일값 가능
            document.write("10입니다<br/>")
            case 30:
            document.write("30입니다<br/>")
            case 20:// 이동하여 실행
            document.write("20입니다<br/>")
            case 40:
            document.write("40입니다<br/>")
            case 20:
            document.write("20입니다<br/>")
        }
        document.write("switch 종료-----------------------1<br/>")

        switch(20){
            case 30:
            document.write("30입니다<br/>")
            break//제어문 탈출 
            case 10://동일값 가능
            document.write("10입니다<br/>")
            break
            case 30:
            document.write("30입니다<br/>")
            break
            case 20:// 이동하여 실행
            document.write("20입니다<br/>")
            break
            case 40:
            document.write("40입니다<br/>")
            break
            case 20: //같은 값이 있을 경우 먼저 설정 딘 case 실행
            document.write("20입니다<br/>")
        }
        document.write("switch 종료-----------------------2<br/>")

        switch(100){
            case 30:
            document.write("30입니다<br/>")
            break//제어문 탈출 
            case 10://동일값 가능
            document.write("10입니다<br/>")
            break
            default : //else 와 같음 
            document.write("기본 값 입니다<br/>")
            break
            case 20:// 이동하여 실행
            document.write("20입니다<br/>")
            break
            case 40:
            document.write("40입니다<br/>")
            break
        }
        document.write("switch 종료-----------------------3<br/>")
      
        switch(100){ //정수,실수,문자열,boolean모두 가능
            case true:
            document.write("true입니다<br/>")
            break//제어문 탈출 
            case 123.456://동일값 가능
            document.write("123.456입니다<br/>")
            break
            default : //else 와 같음 
            document.write("기본 값 입니다<br/>")
            break
            case "나는문어":// 이동하여 실행
            document.write("나는문어<br/>")
            break
            case 40,50,60:
            document.write("40,50,60입니다<br/>")
            break
            case 40:
            document.write("40입니다<br/>")
            break
        }
        document.write("switch 종료-----------------------4<br/>")

        switch(123.456){ //정수,실수,문자열,boolean모두 가능
            case true:
            document.write("true입니다<br/>")
            break//제어문 탈출 
            case 123.456://동일값 가능
            document.write("123.456입니다<br/>")
            break
            default : //else 와 같음 
            document.write("기본 값 입니다<br/>")
            break
            case "나는문어":// 이동하여 실행
            document.write("나는문어<br/>")
            break
            case 40,50,60: // 다중진입 불가능
            document.write("40,50,60입니다<br/>")
            break
            case 40:
            document.write("40입니다<br/>")
            break
        }
         document.write("switch 종료-----------------------5<br/>")

       
          
        let grade = "과장"
        let base = 500

        switch(grade){
            case "부장":
                var bonus = 0.5
                break
            case "과장":
                var bonus = 0.3
                break
            case "대리":
                var bonus = 0.2
                break
            default:
                var bonus = 0.1
                break
        }

        let money = base * (1 + bonus)
        document.write(money)

        document.write("switch 종료-----------------------6<br/>")


        let costcf = 1

         let menu = "아메리카노"
          switch(menu){
            case "아메리카노":
                var mo = 2000
                break
            case "아시아카노":
                var mo = 3000
                break
            case "아프리카노":
                var mo = 4000
                break
          }

          let cf = mo * costcf
          document.write(`가격은 ${cf}`)

    </script>
    
</body>
</html>
