            transform: rotate(90deg);

            let dateBox = document.querySelector(".date")
            let timeBox = document.querySelector(".time")

            function dateGo(){
                let now = new Date()

                dateBox.innerHTML = ttt

                timeBox.innerHTML = `${now.getSeconds()}`

                document.write.setAttribute('@keyframes ti')
                
            }
