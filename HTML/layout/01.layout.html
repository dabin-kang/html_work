<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01.html</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        wrapper{
            display: block;
            width: 80vw;
            height: 100vh;
            background-color: blue;
        }
        header{
            width: 100%;
            height: 100px;
            background-color: antiquewhite;
            position: relative;
        }
        nav{
            width: 200px;
            height: 50px;
            background-color: brown;
            position: absolute;
            bottom: 0px;
            right: 0px;
           
        }
        aside{
            width: 20vw;
            height: 600px;
            float: left;
            margin: 2vw;
            border: 1px solid#000;
          
        }
        section{
            width: 60vw;
            height: 600px;
            float: left;
            margin: 2vw;
            border: 1px solid#000
        }
        footer{
            border: 1px solid #000;
            clear: both;
            margin: 2vw;
            
        }
        article,main{
            width: 80%;
            height: 30px;
            background-color: aqua;
            margin: 5%;
        }



    </style>
</head>
<body>
    <h1>layout</h1>
    <wrapper>
        <header>
            헤더입니다
            <nav>메뉴입니다</nav>
        </header>
        <aside>측면이요</aside>
        <section>
            <h3> section</h3>
            <article>글1</article>
            <article>글2</article>
            <article>글3</article>
            <main>메인</main>
        </section>
        <footer>하단메뉴</footer>
    </wrapper>
    
</body>
</html>
